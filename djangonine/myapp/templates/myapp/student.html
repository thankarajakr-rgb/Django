<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <nav>
        <a href="/">HOME</a>
        <a href="/about">About</a>
        <a href="/student">Student</a>
        <a href="/index">Index</a>

    </nav>
    <h1>This is Student Page</h1>
    <form method="POST">
        {%csrf_token%}
        <label>Name</label>
        <input type="text" required name="name">
        <label>Age</label>
        <input type="number" required name="age">
        <label>Course</label>
        <input type="course" required name="course">
        <button type="submit">Submit</button>
    </form>
    <table>
        <thead>
            
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Course</th>
            </tr>
        </thead>
        <tbody>
            {% for i in students %}
            <tr>
                <td>{{i.id}}</td>
                <td>{{i.Name}}</td>
                <td>{{i.Age}}</td>
                <td>{{i.Course}}</td>
                <td><a href="/update/{{i.id}}">Edit</a></td>
                <td><a href="/delete/{{i.id}}">Delete</a></td>
            </tr>
        </tbody>
        {%endfor%}
    </table>
    
    
</body>
</html>
