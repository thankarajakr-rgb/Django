<!DOCTYPE html>
<html>

<head>

    <title>Courses</title>

</head>

<body>

<nav>

    <a href="/">Home</a>
    <a href="/index/">Index</a>
    <a href="/about/">About</a>
    <a href="/table/">Table</a>
    <a href="/student/">Students</a>

</nav>
<h1>Courses</h1>
<table border="1">
<thead>
<tr>
<th>ID</th>
<th>Course Name</th>
<th>Duration</th>
<th>Topic</th>

 </tr>
</thead>
 <tbody>
 {% for course in courses %}
<tr>
 <td>{{ course.id }}</td>
 <td>{{ course.course_name }}</td>
<td>{{ course.course_duration }}</td>
<td>{{ course.course_topic }}</td>
</tr>{% empty %}<tr>
<td colspan="4">No courses found</td>
</tr>
{% endfor %}
 </tbody>
</table>
</body>
</html>
