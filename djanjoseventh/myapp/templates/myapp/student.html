<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/index">Index</a>
        <a href="/about">About</a>
        <a href="/student">Student</a>
        
    </nav>
    <h1>Student Operation</h1>

    <form method="POST">
        {% csrf_token %}
        <label>Name</label>
        <input type="text" required name="name">
        <label >Age</label>
        <input type="number" required name="age">
        <label>Course</label>
        <input type="text" required name="course">
        <button type="submit">Submit</button>
    </form>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>NAME</th>
                <th>AGE</th>
                <th>COURSE</th>
            </tr>
        </thead>
        <tbody>
            {% for i in student %}
            <tr>
                <td>{{i.id}}</td>
                <td>{{i.name}}</td>
                <td>{{i.age}}</td>
                <td>{{i.couse}}</td>
                <td><a href="/update/{{i.id}}">Edit</a></td>
                <td><a href="/delete/{{i.id}}">DELETE</a></td>
            </tr>
            {%endfor%}
        </tbody>
    </table>
    
</body>
</html>
