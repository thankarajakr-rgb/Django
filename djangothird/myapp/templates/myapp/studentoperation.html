    <h1>This is my operation<h1>

        <form method="POST">
            {%csrf_token%}
            <label>NAME:</label>
            <input type="text" name="name" required>
            <label>Age:</label>
            <input type="numbers" name="age" required>
            <label>Course:</label>
            <input type="text" name="course" required>
            <button type="submit">Submit</button>
            

        </form>
        <table>
            <thead>
                
                <th>Name</th>
                <th>Age</th>
                <th>Course</th>
            </thead>
            <tbody>
                {% for i in students%}
                <tr>
                    <td>{{i.name}}</td>
                    <td>{{i.age}}</td>
                    <td>{{i.course}}</td>
                </tr>
            </tbody>
            {%endfor%}
        </table>
